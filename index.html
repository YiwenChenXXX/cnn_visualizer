<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CNN Visualizer</title>
<style>
    body {
        background: #0c1118;
        color: #e8edf4;
        font-family: Arial, sans-serif;
        padding: 40px;
    }

    #image-grid {
        display: grid;
        grid-template-columns: repeat(5, 50px);
        gap: 4px;
    }

    .pixel {
        height: 50px;
        background: #334155;
        border-radius: 4px;
    }
</style>
</head>
<body>
    <h1>CNN Visualizer</h1>
    <p>Watch how a convolution works.</p>
</body>
</html>
