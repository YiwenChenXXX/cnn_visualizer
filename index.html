<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CNN Visualizer</title>
<style>
    body {
        background: #0c1118;
        color: #e8edf4;
        font-family: Arial, sans-serif;
        padding: 40px;
    }

    #image-grid {
        display: grid;
        grid-template-columns: repeat(5, 50px);
        gap: 4px;
    }

    .pixel {
        height: 50px;
        background: #334155;
        border-radius: 4px;
    }
</style>
</head>
<body>
    <h1>CNN Visualizer</h1>
    <p>Watch how a convolution works.</p>
<div id="image-grid"></div>

<script>
    const grid = document.getElementById("image-grid");

    const image = [
        0, 0, 255, 0, 0,
        0, 0, 255, 0, 0,
        0, 0, 255, 0, 0,
        0, 0, 255, 0, 0,
        0, 0, 255, 0, 0
    ];

    for (let i = 0; i < 25; i++) {
        const pixel = document.createElement("div");
        pixel.className = "pixel";

        const value = image[i];
        pixel.style.background = `rgb(${value}, ${value}, ${value})`;

        grid.appendChild(pixel);
    }
</script>
</body>
</html>
